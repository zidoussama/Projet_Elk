name: DevOps CI Pipeline

on:
  push:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/monitoring-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Docker Build
        run: docker build -t oussamazid/monitoring-backend:latest .

 
      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: oussamazid/monitoring-backend:latest
          severity: CRITICAL
          exit-code: 1

      - name: docker push
        run: docker push oussamazid/monitoring-backend:latest

  sonar:
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Projet_Elk
            -Dsonar.organization=zidoussama
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=backend