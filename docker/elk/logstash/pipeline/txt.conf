input {
  file {
    path => "${LOG_DIR:/logs}/*.txt"
    mode => "read"
    discover_interval => 5
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed_txt.log"
    sincedb_path => "/usr/share/logstash/data/sincedb_txt"
  }
}

filter {
  if [message] {
    mutate { strip => ["message"] }
  }

  mutate {
    add_field => { "source_file" => "%{[log][file][path]}" "source_format" => "txt" "level" => "INFO" }
  }

  grok {
    match => { "source_file" => "(?<upload_id>u_[0-9]{8}_[A-Za-z0-9]+)_" }
    tag_on_failure => []
  }

  if ![event_id] {
    fingerprint {
      source => ["@timestamp", "message"]
      target => "event_id"
      method => "SHA256"
      concatenate_sources => true
    }
  }

  mutate { remove_field => ["host", "event", "log"] }
}

output {
  elasticsearch {
    hosts => ["${ES_HOST:http://elasticsearch:9200}"]
    index => "logs-ecom-%{+YYYY.MM.dd}"
    document_id => "%{source_format}-%{event_id}"
    manage_template => false
    ilm_enabled => false
  }
}
