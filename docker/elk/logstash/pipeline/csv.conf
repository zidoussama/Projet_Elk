input {                                                   # PEB-15: reading
  file {
    path => "${LOG_DIR:/logs}/*.csv"
    mode => "read"
    discover_interval => 5
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed_csv.log"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
  }
}

filter {
  csv {                                                   # PEB-15: parsing
    separator => ","
    columns => ["timestamp","event_id","level","service","environment","event_type",
                "user_id","session_id","order_id","product_id","quantity","amount",
                "currency","status","ip","country","geo_lat","geo_lon","tags_raw","message"]
    skip_empty_columns => true
    #tag_on_failure => ["_csvparsefailure"]                # PEB-17: failure tag
  }

  if [timestamp] == "@timestamp" { drop { } }             # PEB-15: header row

  date {                                                  # PEB-15: timestamp
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]               # PEB-17: failure tag
  }

  mutate {                                                # PEB-15: types
    convert => { "quantity" => "integer" "amount" => "float" "geo_lat" => "float" "geo_lon" => "float" }
    rename => { "geo_lat" => "[location][lat]" "geo_lon" => "[location][lon]" }
    uppercase => ["level"]
  }

  ruby {                                                  # PEB-18: level normalization
    code => '
      valid = ["DEBUG","INFO","WARNING","ERROR","CRITICAL"]
      map = { "WARN" => "WARNING", "ERR" => "ERROR", "FATAL" => "CRITICAL" }
      l = event.get("level").to_s
      l = map[l] if map.key?(l)
      unless valid.include?(l)
        l = "INFO"
        event.tag("level_normalized")
      end
      event.set("level", l)
    '
  }

  ruby {                                                  # PEB-18: tags "a|b|c" -> array
    code => '
      raw = event.get("tags_raw")
      raw.to_s.split("|").each { |t| event.tag(t) } if raw
      event.remove("tags_raw")
    '
  }

  mutate {                                                # PEB-18: traceability fields
    add_field => { "source_file" => "%{[log][file][path]}" "source_format" => "csv" }
  }

  grok {                                                  # PEB-18: upload_id (only for files named u_YYYYMMDD_xxxx_name.csv)
    match => { "source_file" => "(?<upload_id>u_[0-9]{8}_[A-Za-z0-9]+)_" }
    tag_on_failure => []
  }

  if ![event_id] {                                        # PEB-18: stable id if missing
    fingerprint {
      source => ["@timestamp", "message"]
      target => "event_id"
      method => "SHA256"
      concatenate_sources => true
    }
  }

  mutate { remove_field => ["timestamp", "host", "event", "log"] }
}

output {
  if "_csvparsefailure" in [tags] or "_dateparsefailure" in [tags] {     # PEB-17
    elasticsearch {
      hosts => ["${ES_HOST:http://elasticsearch:9200}"]
      index => "logs-dead-letter"
      manage_template => false
      ilm_enabled => false
    }
  } else {                                                               # PEB-15: indexing
    elasticsearch {
      hosts => ["${ES_HOST:http://elasticsearch:9200}"]
      index => "logs-ecom-%{+YYYY.MM.dd}"
      document_id => "%{source_format}-%{event_id}"
      manage_template => false
      ilm_enabled => false
    }
  }
}